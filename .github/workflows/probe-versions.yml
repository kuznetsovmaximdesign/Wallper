name: Probe versions
on:
  push:
    paths:
      - .github/workflows/probe-versions.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Material3 expressive API signatures
        run: |
          G=https://dl.google.com/android/maven2
          mkdir -p m3 && cd m3
          curl -sfL -o m3.jar $G/androidx/compose/material3/material3-android/1.5.0-beta01/material3-android-1.5.0-beta01-sources.jar || echo "no sources jar"
          unzip -q -o m3.jar || true
          sig() { grep -rhn -A "$2" --include=*.kt -E "$1" . | grep -v '^\S*-\s*\*' | head -${3:-60}; echo "-----"; }
          grep -n -A 22 "^public fun HorizontalFloatingToolbar(" commonMain/androidx/compose/material3/FloatingToolbar.kt | grep -v "^\S*-\s*\*" | head -80
          echo -----
          grep -rn -B2 -A 14 "class ToggleButtonColors" --include=*.kt . | head -40
          grep -rn -A 12 "fun toggleButtonColors\|fun colors(" commonMain/androidx/compose/material3/ToggleButton.kt | head -40
          echo -----
          grep -rn -A 10 "fun filledTonalIconButtonColors(" --include=*.kt . | head -30
          grep -rn "fun ListItem(" --include=*.kt . | head
          grep -rn -A 14 "^public fun ListItem(" commonMain/androidx/compose/material3/ListItem.kt | head -40
