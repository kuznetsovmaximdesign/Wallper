name: Android

on:
  push:
    paths-ignore:
      - scripts/probe_*
      - .github/workflows/probe-*.yml
      - README.md
      - docs/**
      - avito-scout/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: android-${{ github.ref }}
  # A newer push supersedes the run in progress: only the latest commit is worth testing.
  cancel-in-progress: true

jobs:
  # Emulator jobs are the slow, costly part: run them only when what they test changed
  # since the last fully green run (so a cancelled run's changes are never skipped).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != push ]; then echo app=true >> "$GITHUB_OUTPUT"; exit 0; fi
          base=$(gh api "repos/${{ github.repository }}/actions/workflows/android.yml/runs?branch=${{ github.ref_name }}&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No green run to compare with: test everything"
            echo app=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Changed since the last green run ($base):"
          git diff --name-only "$base" "${{ github.sha }}" | tee changed.txt
          if grep -qE '^(app/src/(main|androidTest)/|app/(build\.gradle\.kts|proguard-rules\.pro)|gradle/|build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|scripts/(make-test-videos|test-summary)|scripts/footage/|\.github/workflows/android\.yml)' changed.txt; then
            echo app=true >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the emulator tests cover changed: skipping them"
            echo app=false >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-24.04 # pinned: the emulator setup is proven here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and release APK
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintRelease assembleRelease 2>&1 | tee build.log || {
            echo "===== ERRORS ====="
            grep -E "^e: |error:|What went wrong|Lint found|FAILED|Exception:|requires " -A3 build.log | grep -v "^\s*at " | head -120
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: wallper-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish build
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wallper build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            Видеообои Wallper, сборка из `${{ github.ref_name }}` (${{ github.sha }}).
            Установите APK на телефон: он обновит предыдущую сборку.

  # The exact APK people install (R8-shrunk release), launched on an emulator:
  # it must open, show the gallery and keep running. Fast, so it reports first.
  release-smoke:
    needs: [build, changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04 # pinned: the emulator setup is proven here
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wallper-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator
        run: |
          sdk="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "system-images;android-34;google_apis;x86_64" > /dev/null
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd --force -n test \
            -k "system-images;android-34;google_apis;x86_64" -d pixel_7
          printf 'hw.cpu.ncore=4\nhw.ramSize=4096\nhw.gpu.enabled=yes\nhw.gpu.mode=swiftshader_indirect\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          nohup "$sdk/emulator/emulator" -avd test -no-window -no-snapshot -noaudio -no-boot-anim \
            -camera-back none -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          emulator_pid=$!
          adb="$sdk/platform-tools/adb"
          for i in $(seq 1 180); do
            kill -0 "$emulator_pid" 2>/dev/null || break
            if [ "$($adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          if [ -z "${booted:-}" ]; then echo "===== EMULATOR LOG ====="; tail -60 emulator.log; exit 1; fi
          $adb logcat -G 16M || true
          $adb shell svc power stayon true
          $adb shell input keyevent KEYCODE_WAKEUP
          $adb shell wm dismiss-keyguard
          sleep 15

      - name: Release APK opens and keeps running
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          apk=$(ls apk/*.apk | head -1)
          $adb install -r "$apk"
          pkg=com.wallper.live
          $adb logcat -c || true
          $adb shell monkey -p $pkg -c android.intent.category.LAUNCHER 1 > /dev/null
          sleep 30
          pid=$($adb shell pidof $pkg | tr -d '\r')
          echo "===== CRASHES ====="
          $adb logcat -d -b crash | head -80
          echo "===== APP LOG ====="
          $adb logcat -d | grep -E "AndroidRuntime|FATAL|Wallper|$pkg" | grep -v "^\s*$" | tail -60
          $adb exec-out screencap -p > screen.png || true
          if [ -z "$pid" ]; then echo "::error::The release app is not running 30 s after launch"; exit 1; fi
          if $adb logcat -d -b crash | grep -q "Process: $pkg"; then echo "::error::The release app crashed"; exit 1; fi
          echo "Release app is running (pid $pid)"

      # Error guessing at scale: 1,500 random taps, swipes and back presses inside the app
      # (fixed seed, so a failure replays). Monkey keeps going past freezes of other
      # processes; a crash or ANR of our own app fails the build.
      - name: Monkey stress on the release APK
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          pkg=com.wallper.live
          $adb logcat -c || true
          set +e
          # What a person does: taps, swipes, drags, back (no TV/media keys, no app switching).
          $adb shell monkey -p $pkg -s 4242 --throttle 250 \
            --pct-touch 55 --pct-motion 30 --pct-nav 5 --pct-majornav 10 \
            --pct-trackball 0 --pct-syskeys 0 --pct-appswitch 0 --pct-flip 0 --pct-anyevent 0 \
            --pct-pinchzoom 0 --pct-rotation 0 \
            --ignore-security-exceptions --ignore-timeouts --ignore-crashes -v 1500 > monkey.log 2>&1
          code=$?
          set -e
          tail -8 monkey.log
          echo "===== WHO FROZE OR CRASHED ====="
          grep -E "NOT RESPONDING|CRASH:|ANR in" -A3 monkey.log | head -30 || true
          $adb logcat -d | grep -E "ANR in|FATAL EXCEPTION" -A4 | head -40 || true
          echo "===== CRASHES ====="
          $adb logcat -d -b crash | head -80
          echo "===== OUR MAIN THREAD IF IT FROZE ====="
          timeout 10 $adb root > /dev/null 2>&1 || true
          sleep 3
          ours=0
          for f in $(timeout 10 $adb shell ls /data/anr/ 2>/dev/null | tr -d '\r'); do
            timeout 10 $adb shell cat "/data/anr/$f" > anr.txt 2>/dev/null || continue
            grep -q "Cmd line: $pkg" anr.txt || continue
            echo "--- $f"
            awk '/^"main"/{p=1} p{print} p&&/^$/{exit}' anr.txt > main.txt
            head -45 main.txt
            # Code from our APK on the frozen main thread (ours or a bundled library; R8 names
            # its frames r8-map-id-…) is a real bug. A main thread only waiting in the framework
            # for a software-rendered frame while system apps freeze too is the emulator.
            if grep -qE "at com\.wallper\.|r8-map-id" main.txt; then ours=1; fi
          done
          if $adb logcat -d -b crash | grep -q "Process: $pkg" || grep -qE "CRASH: $pkg( |\$)" monkey.log; then
            echo "::error::The release app crashed under random input"; exit 1
          fi
          if [ "$ours" = 1 ]; then echo "::error::Our code froze the main thread under random input"; exit 1; fi
          if grep -qE "NOT RESPONDING: $pkg( |\$)" monkey.log; then
            echo "::warning::The emulator stalled rendering (system apps froze too); main thread was not in our code"
          fi
          if ! $adb shell pidof $pkg > /dev/null; then $adb shell monkey -p $pkg -c android.intent.category.LAUNCHER 1 > /dev/null; sleep 5; fi
          $adb shell pidof $pkg > /dev/null || { echo "::error::The app is gone after the stress run"; exit 1; }
          echo "Random input: $(grep -oE 'Events injected: [0-9]+' monkey.log | tail -1), the app neither crashed nor froze"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-screen
          path: screen.png
          if-no-files-found: ignore

  # Every user-facing action, run on an emulator against generated test videos.
  # Screenshots decide: after each action the wallpaper must still be visible and moving.
  ui-tests:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04 # pinned: the emulator setup is proven here
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Two devices x two suites, in parallel: each job stays well inside its time.
        device:
          - name: phone
            screen: ""
          # The Fold's inner screen: wide enough for the side-by-side layout.
          - name: foldable
            screen: "1840x2208"
        suite:
          - name: actions
            classes: com.wallper.live.GalleryTest,com.wallper.live.ViewerTest
          - name: states
            classes: com.wallper.live.StatesTest
    name: ui-tests (${{ matrix.device.name }}, ${{ matrix.suite.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate test videos
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          scripts/make-test-videos.sh

      - name: Build test APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest 2>&1 | tee build.log || {
            echo "===== ERRORS ====="
            grep -E "^e: |error:|What went wrong|Lint found|FAILED|Exception:|requires " -A3 build.log | grep -v "^\s*at " | head -120
            exit 1
          }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/android/sdk/ndk /usr/share/swift "$AGENT_TOOLSDIRECTORY/PyPy" || true
          df -h "$HOME" | tail -1

      - name: Start emulator
        run: |
          sdk="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "system-images;android-34;google_apis;x86_64" > /dev/null
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd --force -n test \
            -k "system-images;android-34;google_apis;x86_64" -d pixel_7
          printf 'hw.cpu.ncore=4\nhw.ramSize=4096\ndisk.dataPartition.size=3G\nhw.gpu.enabled=yes\nhw.gpu.mode=swiftshader_indirect\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          nohup "$sdk/emulator/emulator" -avd test -no-window -no-snapshot -noaudio -no-boot-anim \
            -camera-back none -gpu swiftshader_indirect -accel on -partition-size 3072 > emulator.log 2>&1 &
          emulator_pid=$!
          adb="$sdk/platform-tools/adb"
          for i in $(seq 1 180); do
            kill -0 "$emulator_pid" 2>/dev/null || break # the emulator exited: show why right away
            if [ "$($adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          if [ -z "${booted:-}" ]; then echo "===== EMULATOR LOG ====="; tail -60 emulator.log; exit 1; fi
          $adb shell settings put global window_animation_scale 1
          $adb logcat -G 16M || true
          $adb shell svc power stayon true
          $adb shell input keyevent KEYCODE_WAKEUP
          $adb shell wm dismiss-keyguard
          $adb shell input keyevent 82
          $adb shell settings put secure lockscreen.disabled 1 || true
          # Let the post-boot storm pass (broadcasts, launcher, Play services) before testing:
          # tests that start during it meet "isn't responding" dialogs of system apps.
          timeout 180 $adb shell am wait-for-broadcast-idle > /dev/null 2>&1 || true
          sleep 20
          $adb shell input keyevent KEYCODE_HOME
          if [ -n "${{ matrix.device.screen }}" ]; then $adb shell wm size ${{ matrix.device.screen }}; $adb shell wm density 360; fi
          echo "Emulator ready"

      - name: UI tests on emulator
        run: |
          set -o pipefail
          # A wedged emulator must not hold the job for an hour without a word.
          timeout 35m ./gradlew connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=${{ matrix.suite.classes }} > test.log 2>&1 && ok=1 || ok=0
          echo "===== UI TESTS ====="
          [ "$ok" = 1 ] || tail -25 test.log
          python3 -I scripts/test-summary.py app/build/outputs/androidTest-results failed.txt
          # A software emulator drops frames, windows and even its adb link now and then:
          # tests that failed get exactly one more run, reported separately. A real bug
          # fails both times.
          if [ "$ok" != 1 ] && [ -s failed.txt ] && "$ANDROID_HOME/platform-tools/adb" get-state > /dev/null 2>&1; then
            echo "===== RETRY OF FAILED TESTS: $(cat failed.txt) ====="
            timeout 20m ./gradlew connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class="$(cat failed.txt)" > retry.log 2>&1 && ok=1 || ok=0
            [ "$ok" = 1 ] || tail -15 retry.log
            python3 -I scripts/test-summary.py app/build/outputs/androidTest-results
            [ "$ok" = 1 ] && echo "::warning::Passed on retry: $(cat failed.txt)"
          fi
          [ "$ok" = 1 ]

      - name: Test timings
        if: always()
        run: |
          adb=$ANDROID_HOME/platform-tools/adb
          echo "===== CRASHES ====="
          timeout 20 $adb logcat -d -b crash | grep -A25 "Process: com.wallper" | head -60 || true
          echo "===== ANR TRACES (main thread) ====="
          timeout 10 $adb root > /dev/null 2>&1 || true
          sleep 3
          for f in $(timeout 10 $adb shell ls /data/anr/ 2>/dev/null | tr -d '\r'); do
            echo "--- $f"
            timeout 10 $adb shell cat "/data/anr/$f" > anr.txt 2>/dev/null || continue
            grep -q "Cmd line: com.wallper" anr.txt || continue
            grep -m1 "Cmd line" anr.txt || true
            awk '/^"main"/{p=1} p{print} p&&/^$/{exit}' anr.txt | head -45
          done
          echo "===== APP ====="
          timeout 20 $adb logcat -d | grep -E "WallperScreen|WallperTest|WallperMotion|WallperCovers|WallperCodec|WallperSession" | grep -vE ": \s+at (android|java|kotlin|kotlinx|com\.android)\." | tail -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-reports-${{ matrix.device.name }}-${{ matrix.suite.name }}
          path: app/build/reports/androidTests
          if-no-files-found: ignore
