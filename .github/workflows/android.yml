name: Android

on:
  push:
    paths-ignore:
      - scripts/**
      - .github/workflows/probe-*.yml
      - README.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  # Emulator runs take a while: queue new pushes instead of cancelling them.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and release APK
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintRelease assembleRelease 2>&1 | tee build.log || {
            echo "===== ERRORS ====="
            grep -E "^e: |error:|What went wrong|Lint found|FAILED|Exception:|requires " -A3 build.log | grep -v "^\s*at " | head -120
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: wallper-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish build
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wallper build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            Видеообои Wallper, сборка из `${{ github.ref_name }}` (${{ github.sha }}).
            Установите APK на телефон: он обновит предыдущую сборку.

  # Every user-facing action, run on an emulator against generated test videos.
  # Screenshots decide: after each action the wallpaper must still be visible and moving.
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            screen: ""
          # The Fold's inner screen: wide enough for the side-by-side layout.
          - name: foldable
            screen: "1840x2208"
    name: ui-tests (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate test videos
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          scripts/make-test-videos.sh

      - name: Build test APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest 2>&1 | tee build.log || {
            echo "===== ERRORS ====="
            grep -E "^e: |error:|What went wrong|Lint found|FAILED|Exception:|requires " -A3 build.log | grep -v "^\s*at " | head -120
            exit 1
          }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/android/sdk/ndk /usr/share/swift "$AGENT_TOOLSDIRECTORY/PyPy" || true
          df -h "$HOME" | tail -1

      - name: Start emulator
        run: |
          sdk="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "system-images;android-34;google_apis;x86_64" > /dev/null
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd --force -n test \
            -k "system-images;android-34;google_apis;x86_64" -d pixel_7
          printf 'hw.ramSize=4096\ndisk.dataPartition.size=6G\nhw.gpu.enabled=yes\nhw.gpu.mode=swiftshader_indirect\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          nohup "$sdk/emulator/emulator" -avd test -no-window -no-snapshot -noaudio -no-boot-anim \
            -camera-back none -gpu swiftshader_indirect -accel on -partition-size 3072 > emulator.log 2>&1 &
          emulator_pid=$!
          adb="$sdk/platform-tools/adb"
          for i in $(seq 1 180); do
            kill -0 "$emulator_pid" 2>/dev/null || break # the emulator exited: show why right away
            if [ "$($adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          if [ -z "${booted:-}" ]; then echo "===== EMULATOR LOG ====="; tail -60 emulator.log; exit 1; fi
          $adb shell settings put global window_animation_scale 1
          $adb shell input keyevent 82
          if [ -n "${{ matrix.screen }}" ]; then $adb shell wm size ${{ matrix.screen }}; $adb shell wm density 360; fi
          echo "Emulator ready"

      - name: UI tests on emulator
        run: |
          set -o pipefail
          ./gradlew connectedDebugAndroidTest 2>&1 | tee test.log || {
            echo "===== TEST FAILURES ====="
            grep -E "FAILED|AssertionError|Exception|tests completed|No moving|disappeared|froze|took" test.log | grep -v "^\s*at " | head -80
            exit 1
          }
          grep -E "tests completed|Finished" test.log || true

      - name: Test timings
        if: always()
        run: timeout 20 $ANDROID_HOME/platform-tools/adb logcat -d -s WallperScreen:I WallperTest:I | tail -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-reports-${{ matrix.name }}
          path: app/build/reports/androidTests
          if-no-files-found: ignore
