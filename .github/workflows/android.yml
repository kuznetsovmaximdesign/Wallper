name: Android

on:
  push:
    paths-ignore:
      - scripts/**
      - .github/workflows/probe-*.yml
      - README.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and release APK
        run: ./gradlew --stacktrace testReleaseUnitTest lintRelease assembleRelease

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: wallper-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish build
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wallper build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            Видеообои Wallper, сборка из `${{ github.ref_name }}` (${{ github.sha }}).
            Установите APK на телефон: он обновит предыдущую сборку.

  # Every user-facing action, run on an emulator against generated test videos.
  # Screenshots decide: after each action the wallpaper must still be visible and moving.
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            profile: pixel_7
          - name: foldable
            profile: pixel_fold
    name: ui-tests (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate test videos
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          scripts/make-test-videos.sh

      - name: Build test APKs
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest

      - name: UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: ./gradlew --stacktrace connectedDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-reports-${{ matrix.name }}
          path: app/build/reports/androidTests
          if-no-files-found: ignore
