{% extends "base.html" %}
{% block main %}
<h1>Темы</h1>
{% if topics %}
<ul class="topics">
  {% for t in topics %}
  <li><a href="/topics/{{ t.id }}"><strong>{{ t.name }}</strong></a>
    <span class="muted">{{ t.sellers }} исполн.</span></li>
  {% endfor %}
</ul>
{% else %}
<p class="muted">Пока нет ни одной темы.</p>
{% endif %}
<form method="post" action="/topics" class="card">
  <h2>Новая тема</h2>
  <label>Название <input name="name" required placeholder="Септик"></label>
  <label>Что нужно сделать <textarea name="description" rows="3" placeholder="Установка септика под ключ на участке 10 соток"></textarea></label>
  <button>Создать</button>
</form>
{% endblock %}
